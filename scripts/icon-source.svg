<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d3d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- moon -->
  <circle cx="76" cy="24" r="10" fill="url(#moonGlow)"/>

  <!-- a couple of festive stars -->
  <circle cx="16" cy="18" r="1.3" fill="#fef3c7"/>
  <circle cx="26" cy="12" r="0.9" fill="#fef3c7"/>
  <circle cx="14" cy="30" r="0.8" fill="#fef3c7"/>

  <g stroke="#7f1d1d" stroke-width="1.4" stroke-linecap="round" fill="none">
    <!-- antennae -->
    <path d="M46,32 Q38,20 30,11"/>
    <path d="M54,32 Q62,20 70,11"/>
    <!-- legs left -->
    <path d="M39,52 L27,50"/>
    <path d="M40,60 L28,60"/>
    <path d="M41,68 L30,70"/>
    <!-- legs right -->
    <path d="M61,52 L73,50"/>
    <path d="M60,60 L72,60"/>
    <path d="M59,68 L70,70"/>
  </g>

  <!-- claws -->
  <g fill="#f97316" stroke="#7f1d1d" stroke-width="1.4">
    <path d="M39,40 C28,34 20,32 14,24 C12,30 14,35 19,38 C13,38 9,41 7,46 C13,50 21,49 26,44 C31,44 36,43 40,45 Z"/>
    <path d="M61,40 C72,34 80,32 86,24 C88,30 86,35 81,38 C87,38 91,41 93,46 C87,50 79,49 74,44 C69,44 64,43 60,45 Z"/>
  </g>

  <!-- tail fan -->
  <g fill="#f97316" stroke="#7f1d1d" stroke-width="1.2">
    <ellipse cx="41" cy="90" rx="5.5" ry="9" transform="rotate(-24 41 90)"/>
    <ellipse cx="50" cy="93" rx="5.5" ry="9.5"/>
    <ellipse cx="59" cy="90" rx="5.5" ry="9" transform="rotate(24 59 90)"/>
  </g>

  <!-- tail segments -->
  <g fill="#fb923c" stroke="#7f1d1d" stroke-width="1.4">
    <ellipse cx="50" cy="80" rx="8" ry="7"/>
    <ellipse cx="50" cy="71" rx="9.5" ry="7.5"/>
    <ellipse cx="50" cy="62" rx="11" ry="8"/>
  </g>

  <!-- body / head -->
  <ellipse cx="50" cy="46" rx="14" ry="18" fill="#f97316" stroke="#7f1d1d" stroke-width="1.6"/>

  <!-- eyes -->
  <circle cx="45" cy="38" r="2.1" fill="#1e1b4b"/>
  <circle cx="55" cy="38" r="2.1" fill="#1e1b4b"/>
  <circle cx="45.6" cy="37.4" r="0.6" fill="#fef3c7"/>
  <circle cx="55.6" cy="37.4" r="0.6" fill="#fef3c7"/>
</svg>
